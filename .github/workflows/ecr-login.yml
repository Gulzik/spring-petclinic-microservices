name: Reusable ECR Login

on:
  workflow_call:
    inputs:
      aws-region:
        description: AWS region for ECR
        type: string
        required: true
    secrets:
      aws-role-arn:
        description: IAM role ARN to assume via OIDC
        required: true
      aws-account-id:
        description: AWS account ID (used to build the ECR registry URL)
        required: true
    outputs:
      registry:
        description: ECR registry hostname (account.dkr.ecr.region.amazonaws.com)
        value: ${{ jobs.login.outputs.registry }}

jobs:
  login:
    name: Configure AWS and ECR
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: ${{ secrets.aws-account-id }}
